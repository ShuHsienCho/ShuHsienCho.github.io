<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">Calibrating continuous variant scores across variant types</title><desc id="d">Raw scores for stop-gain, frameshift and in-frame variants sit on different scales; after calibration they share one severity scale. Schematic illustration.</desc>
<style>
text { font-family: "Source Sans 3", "Source Sans Pro", "Helvetica Neue", Arial, sans-serif; fill: #23324A; }
.hd { font-size: 18px; font-weight: 600; }
.lab { font-size: 16px; }
.sm { font-size: 14px; fill: #5B6578; }
</style>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23324A"/></marker>
</defs>
<rect x="1" y="1" width="798" height="448" rx="16" fill="#F7F8FA" stroke="#D9DEE5" stroke-width="1.5"/>
<g transform="translate(0,22)">
<text class="hd" x="50" y="62">Raw scores differ by variant type</text>
<text class="lab" x="50" y="134">Stop-gain</text>
<line x1="165" y1="140" x2="350" y2="140" stroke="#8A94A6" stroke-width="1.5"/>
<path d="M272.6,140 C288.8,140 296.0,90 305.0,90 C314.0,90 321.2,140 337.4,140 Z" fill="#7A4E8C" fill-opacity="0.22" stroke="#7A4E8C" stroke-width="2"/>
<text class="lab" x="50" y="214">Frameshift</text>
<line x1="165" y1="220" x2="350" y2="220" stroke="#8A94A6" stroke-width="1.5"/>
<path d="M214.6,220 C239.8,220 251.0,175 265.0,175 C279.0,175 290.2,220 315.4,220 Z" fill="#C9922E" fill-opacity="0.22" stroke="#C9922E" stroke-width="2"/>
<text class="lab" x="50" y="294">In-frame</text>
<line x1="165" y1="300" x2="350" y2="300" stroke="#8A94A6" stroke-width="1.5"/>
<path d="M171.0,300 C198.0,300 210.0,260 225.0,260 C240.0,260 252.0,300 279.0,300 Z" fill="#1F6F78" fill-opacity="0.22" stroke="#1F6F78" stroke-width="2"/>
<line x1="372" y1="220" x2="446" y2="220" stroke="#23324A" stroke-width="2" marker-end="url(#a-ink)"/>
<text class="sm" x="409" y="188" text-anchor="middle">Calibrate</text><text class="sm" x="409" y="205" text-anchor="middle">across types</text>
<text class="hd" x="470" y="62">One common scale</text>
<path d="M553.2,300 C576.6,300 587.0,210 600.0,210 C613.0,210 623.4,300 646.8,300 Z" fill="#1F6F78" fill-opacity="0.18" stroke="#1F6F78" stroke-width="2"/>
<path d="M613.2,300 C636.6,300 647.0,190 660.0,190 C673.0,190 683.4,300 706.8,300 Z" fill="#C9922E" fill-opacity="0.18" stroke="#C9922E" stroke-width="2"/>
<path d="M673.2,300 C696.6,300 707.0,170 720.0,170 C733.0,170 743.4,300 766.8,300 Z" fill="#7A4E8C" fill-opacity="0.18" stroke="#7A4E8C" stroke-width="2"/>
<line x1="480" y1="300" x2="770" y2="300" stroke="#8A94A6" stroke-width="1.5"/>
<text class="sm" x="480" y="324">Less severe</text><text class="sm" x="770" y="324" text-anchor="end">More severe</text>
</g>
<text class="sm" x="770" y="428" text-anchor="end">Schematic illustration</text>
</svg>
