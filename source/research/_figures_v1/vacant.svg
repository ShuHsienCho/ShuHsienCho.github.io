<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">Annotation-informed rare-variant association test</title><desc id="d">Rare variants in a gene are colored by a continuous annotation score, grouped adaptively into strata, and an effect is estimated for each stratum. Schematic illustration.</desc>
