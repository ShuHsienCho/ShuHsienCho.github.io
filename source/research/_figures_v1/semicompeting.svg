<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
<title id="t">Causal mediation for semi-competing risks</title><desc id="d">Exposure affects death directly and through a non-terminal event; death can occur first and prevent the non-terminal event from being observed.</desc>
<style>
text { font-family: "Source Sans 3", "Source Sans Pro", "Helvetica Neue", Arial, sans-serif; fill: #23324A; }
