<line x1="482" y1="145" x2="615" y2="277" stroke="#F7F8FA" stroke-width="9"/>
<line x1="482" y1="145" x2="615" y2="277" stroke="#1F6F78" stroke-width="3" marker-end="url(#a-teal)"/>
<line x1="205" y1="300" x2="606" y2="300" stroke="#F7F8FA" stroke-width="9"/>
