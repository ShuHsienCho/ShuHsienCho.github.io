<rect x="55" y="277" width="150" height="46" rx="23" fill="#FFFFFF" stroke="#23324A" stroke-width="1.5"/>
<text class="lab" x="130" y="306" text-anchor="middle">Exposure</text>
<rect x="300" y="99" width="200" height="46" rx="23" fill="#FFFFFF" stroke="#23324A" stroke-width="1.5"/>
<text class="lab" x="400" y="128" text-anchor="middle">Non-terminal event</text>
